<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40-Day Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="overlay">
            <h1>40-Day Weather Forecast</h1>
            
            <div class="search-container">
                <input type="text" id="city-input" placeholder="Enter city name">
                <button id="search-btn">Get Weather</button>
            </div>
            
            <div id="loading" class="loading">
                <i class="fas fa-spinner fa-spin"></i> Loading...
            </div>
            
            <div id="error-message" class="error-message"></div>
            
            <div id="current-weather" class="current-weather">
                <!-- Current weather will be displayed here -->
            </div>
            
            <div id="forecast-container" class="forecast-container">
                <!-- Forecast data will be displayed here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
