<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Structured Output Generator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6;
      }
      .gradient-bg {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .card {
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.95);
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div class="gradient-bg py-6">
      <div class="container mx-auto px-4">
        <h1 class="text-4xl font-semibold text-white text-center mb-2">
          AI Structured Output Generator
        </h1>
        <p class="text-gray-100 text-center">
          Transform your input into structured data using OpenAI
        </p>
      </div>
    </div>

    <div class="container mx-auto px-4 py-8">
      <div class="max-w-4xl mx-auto">
        <div class="card rounded-lg shadow-lg p-6 mb-8">
          <form id="outputForm" class="space-y-6">
            <div>
              <label
                for="prompt"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Your Input</label
              >
              <textarea
                id="prompt"
                name="prompt"
                rows="4"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                placeholder="Enter your text here..."
              ></textarea>
            </div>

            <div>
              <label
                for="outputType"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Output Structure</label
              >
              <select
                id="outputType"
                name="outputType"
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
              >
                <option value="json">JSON</option>
                <option value="xml">XML</option>
                <option value="yaml">YAML</option>
              </select>
            </div>

            <button
              type="submit"
              class="w-full gradient-bg text-white py-2 px-4 rounded-md hover:opacity-90 transition-opacity"
            >
              Generate Structured Output
            </button>
          </form>
        </div>

        <div class="card rounded-lg shadow-lg p-6">
          <h2 class="text-xl font-semibold text-gray-800 mb-4">
            Generated Output
          </h2>
          <pre id="output" class="bg-gray-50 p-4 rounded-md overflow-x-auto">
                    <code class="text-sm text-gray-800">Output will appear here...</code>
                </pre>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("outputForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const prompt = document.getElementById("prompt").value;
          const outputType = document.getElementById("outputType").value;
          const outputElement = document.getElementById("output");

          try {
            outputElement.innerHTML =
              '<code class="text-sm text-gray-800">Processing...</code>';

            const response = await fetch("process.php", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                prompt: prompt,
                outputType: outputType,
              }),
            });

            const data = await response.json();

            if (data.success) {
              outputElement.innerHTML = `<code class="text-sm text-gray-800">${data.result}</code>`;
            } else {
              throw new Error(data.message);
            }
          } catch (error) {
            outputElement.innerHTML = `<code class="text-sm text-red-600">Error: ${error.message}</code>`;
          }
        });
    </script>
  </body>
</html>
